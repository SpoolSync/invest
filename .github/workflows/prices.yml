# Saves closing prices to prices.json every weekday evening (Toronto time), so Investments can update
# holdings without anyone typing prices. Public market data only; nothing about any user is involved.
name: Daily prices
on:
  schedule:
    - cron: "37 22 * * 1-5"   # 17:37 Toronto in winter, 18:37 in summer, after the close
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: prices
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices
        run: python3 tools/prices.py
      - name: Save
        run: |
          git config user.name "pixora-prices"
          git config user.email "pixora-prices@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "Prices for $(date -u +%F)" && git push)
